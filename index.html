<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MBTI로 찾는 나의 포켓몬</title>
    <style>
        /* 기본 리셋 및 폰트 설정 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #FFFDF0;
            color: #333333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px 15px;
        }

        /* 메인 컨테이너 카드 */
        .container {
            width: 100%;
            max-width: 680px;
            background-color: #FFF9E6;
            border: 4px solid #FFE082;
            border-radius: 28px;
            padding: 30px 24px;
            box-shadow: 0 12px 28px rgba(220, 170, 50, 0.18);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        /* 헤더 스타일링 */
        .header {
            margin-bottom: 25px;
        }

        .badge {
            display: inline-block;
            background-color: #FFB74D;
            color: #FFFFFF;
            font-weight: bold;
            font-size: 0.95rem;
            padding: 6px 16px;
            border-radius: 20px;
            margin-bottom: 12px;
            letter-spacing: 1px;
        }

        .title {
            font-size: 2.1rem;
            color: #5D4037;
            font-weight: 800;
            margin-bottom: 8px;
            word-break: keep-all;
        }

        .subtitle {
            font-size: 1.1rem;
            color: #8D6E63;
            font-weight: 600;
            word-break: keep-all;
        }

        /* MBTI 그리드 선택 영역 */
        .mbti-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-top: 20px;
        }

        @media (max-width: 480px) {
            .mbti-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }
            .title {
                font-size: 1.75rem;
            }
        }

        .mbti-btn {
            background-color: #FFFFFF;
            border: 2.5px solid #FFD54F;
            border-radius: 18px;
            padding: 16px 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 8px rgba(0,0,0,0.04);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .mbti-btn:hover {
            transform: translateY(-4px);
            background-color: #FFF8E1;
            border-color: #FFB300;
            box-shadow: 0 6px 14px rgba(255, 179, 0, 0.25);
        }

        .mbti-btn:active {
            transform: translateY(0);
        }

        .mbti-name {
            font-size: 1.25rem;
            font-weight: 800;
            color: #4E342E;
        }

        .mbti-desc {
            font-size: 0.8rem;
            color: #795548;
            margin-top: 4px;
            font-weight: 600;
        }

        /* 결과 화면 스타일링 */
        .result-card {
            display: none;
            animation: fadeIn 0.4s ease-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .pokemon-emoji-wrap {
            width: 140px;
            height: 140px;
            background-color: #FFF3E0;
            border: 4px solid #FFE082;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 18px auto;
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.06), 0 8px 16px rgba(255, 183, 77, 0.2);
            position: relative;
        }

        .pokemon-emoji {
            font-size: 4.5rem;
            line-height: 1;
            user-select: none;
        }

        .result-mbti-tag {
            display: inline-block;
            background-color: #FFE082;
            color: #5D4037;
            font-size: 1.1rem;
            font-weight: 800;
            padding: 4px 16px;
            border-radius: 12px;
            margin-bottom: 6px;
        }

        .pokemon-name {
            font-size: 2.2rem;
            font-weight: 800;
            color: #3E2723;
            margin-bottom: 16px;
        }

        .info-box {
            background-color: #FFFFFF;
            border: 2px solid #FFE082;
            border-radius: 18px;
            padding: 18px 20px;
            text-align: left;
            margin-bottom: 16px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
        }

        .info-title {
            font-size: 1.05rem;
            font-weight: 800;
            color: #F57C00;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .info-text {
            font-size: 1.05rem;
            color: #4E342E;
            line-height: 1.6;
            word-break: keep-all;
            font-weight: 500;
        }

        .match-box {
            background-color: #FFF3E0;
            border: 2px dashed #FFB74D;
            border-radius: 18px;
            padding: 16px 20px;
            text-align: left;
            margin-bottom: 24px;
        }

        .match-title {
            font-size: 1.05rem;
            font-weight: 800;
            color: #E65100;
            margin-bottom: 6px;
        }

        .match-mbti {
            font-size: 1.15rem;
            font-weight: 800;
            color: #D84315;
        }

        .reset-btn {
            background-color: #FFB300;
            color: #FFFFFF;
            border: none;
            border-radius: 20px;
            padding: 14px 36px;
            font-size: 1.15rem;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 6px 16px rgba(255, 179, 0, 0.35);
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .reset-btn:hover {
            background-color: #FFA000;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(255, 160, 0, 0.45);
        }

        .reset-btn:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- 선택 화면 (초기 상태) -->
        <div id="selection-view">
            <div class="header">
                <span class="badge">MBTI × POKÉMON</span>
                <h1 class="title">나와 닮은 포켓몬 찾기</h1>
                <p class="subtitle">나의 MBTI 유형을 클릭해 보세요!</p>
            </div>

            <div class="mbti-grid" id="mbti-grid">
                <!-- JS에서 버튼들이 Dynamic하게 생성됩니다 -->
            </div>
        </div>

        <!-- 결과 화면 -->
        <div id="result-view" class="result-card">
            <div class="pokemon-emoji-wrap">
                <span class="pokemon-emoji" id="res-emoji">⚡</span>
            </div>
            
            <div>
                <span class="result-mbti-tag" id="res-mbti-tag">INFP</span>

            </div>

            <div class="info-box">
                <div class="info-title">✨ 왜 잘 어울릴까요?</div>
                <p class="info-text" id="res-reason">
                    설명 내용이 들어갑니다.
                </p>
            </div>

            <div class="match-box">
                <div class="match-title">💖 환상의 찰떡 궁합</div>
                <p class="info-text">
                    <span class="match-mbti" id="res-match-mbti">ENFJ (토게키스)</span><br>

                </p>
            </div>

            <button class="reset-btn" onclick="resetSelection()">
                🔄 다시 고르기
            </button>
        </div>

    </div>

        // 초기 화면 버튼 생성
        function initGrid() {
            const grid = document.getElementById('mbti-grid');
            grid.innerHTML = '';

            Object.keys(mbtiData).forEach(mbti => {
                const btn = document.createElement('button');
                btn.className = 'mbti-btn';
                btn.onclick = () => showResult(mbti);

                btn.innerHTML = `
                    <span class="mbti-name">${mbti}</span>
                    <span class="mbti-desc">${mbtiData[mbti].title}</span>
                `;
                grid.appendChild(btn);
            });
        }

        // 결과 화면 표시
        function showResult(mbti) {
            const data = mbtiData[mbti];
            if (!data) return;

            document.getElementById('res-emoji').innerText = data.emoji;
            document.getElementById('res-mbti-tag').innerText = `${mbti} · ${data.title}`;
            document.getElementById('res-pokemon-name').innerText = data.pokemon;
            document.getElementById('res-reason').innerText = data.reason;
            
            document.getElementById('res-match-mbti').innerText = `${data.bestMatch} (${data.bestPokemon})`;
            document.getElementById('res-match-reason').innerText = data.matchReason;

            document.getElementById('selection-view').style.display = 'none';
            document.getElementById('result-view').style.display = 'block';

            // 페이지 상단으로 스크롤
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // 초기화 (다시 고르기)
        function resetSelection() {
            document.getElementById('result-view').style.display = 'none';
            document.getElementById('selection-view').style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
